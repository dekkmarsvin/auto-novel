name: Publish Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      [
        .github/workflows/cd-web.yml,
        web/**,
        packages/crawler/**,
        packages/translator/**,
        package.json,
        pnpm-lock.yaml,
        pnpm-workspace.yaml,
        .dockerignore,
      ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-web
  cancel-in-progress: true

env:
  IMAGE_OWNER: ${{ github.repository_owner }}
  IMAGE_NAME: auto-novel-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build metadata
        id: build_metadata
        run: echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          push: true
          provenance: false
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_REPOSITORY=${{ github.repository }}
            BUILD_TIME=${{ steps.build_metadata.outputs.build_time }}
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Delete old package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="/users/${IMAGE_OWNER}/packages/container/${IMAGE_NAME}/versions"
          if ! ids="$(gh api "${endpoint}?per_page=100" --jq 'sort_by(.created_at) | reverse | .[1:][] | .id' 2>/dev/null)"; then
            endpoint="/orgs/${IMAGE_OWNER}/packages/container/${IMAGE_NAME}/versions"
            ids="$(gh api "${endpoint}?per_page=100" --jq 'sort_by(.created_at) | reverse | .[1:][] | .id')"
          fi
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            gh api --method DELETE "${endpoint}/${id}"
          done <<< "$ids"
