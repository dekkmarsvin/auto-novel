name: Fork Invariants

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selective-feature-sync:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select comparison base
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if ($env:EVENT_NAME -eq 'pull_request') {
            $comparisonBase = "origin/$env:BASE_BRANCH"
          } elseif (
            $env:EVENT_NAME -eq 'push' -and
            -not [string]::IsNullOrWhiteSpace($env:BEFORE_SHA) -and
            $env:BEFORE_SHA -ne '0000000000000000000000000000000000000000'
          ) {
            $comparisonBase = $env:BEFORE_SHA
          } else {
            $comparisonBase = 'HEAD~1'
          }
          "BASE_REF=$comparisonBase" >> $env:GITHUB_ENV
          Write-Host "Comparison base: $comparisonBase"

      - name: Check selective feature sync invariants
        shell: pwsh
        run: ./scripts/check-selective-feature-sync.ps1 -BaseRef $env:BASE_REF
