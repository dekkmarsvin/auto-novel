name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: npm run build

      - name: Typecheck the active daemon entry and routes
        run: pnpm --filter @auto-novel/daemon exec tsc -p tsconfig.app.json --noEmit

      - name: Verify daemon offline regressions
        run: pnpm --filter @auto-novel/daemon test

      - name: Verify web regressions
        run: pnpm --filter @auto-novel/web test

      - name: Verify admin credential boundaries
        run: pnpm --filter @auto-novel/admin test

      - name: Verify built storage bootstrap
        run: node web/tests/builtBootstrap.acceptance.mjs

      - name: Verify translation pipeline
        run: pnpm --filter @auto-novel/translator test

      - name: Verify crawler transport regressions
        run: pnpm --filter @auto-novel/crawler test tests/web/nailain.offline.test.ts tests/web/pixiv.offline.test.ts

  admin-sync-authorization:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Verify API authorization and source settings regressions
        run: ./gradlew --no-daemon test --tests api.WebNovelAdminSyncAllRouteTest --tests api.ApiRouteRetirementTest --tests api.SiteSettingRouteTest --tests infra.provider.providers.NailainOfflineTest --tests infra.common.SiteSettingRepositoryTest
        working-directory: server

  go-api:
    uses: ./.github/workflows/ci-api.yml
