name: Daemon Offline Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ci-daemon.yml
      - daemon/**
      - packages/crawler/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-daemon.yml
      - daemon/**
      - packages/crawler/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  daemon-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @auto-novel/daemon... build
      - name: Typecheck the active daemon entry and routes
        run: pnpm --filter @auto-novel/daemon exec tsc -p tsconfig.app.json --noEmit
      - name: Run daemon offline tests (including admin route and config regressions)
        run: pnpm --filter @auto-novel/daemon test
