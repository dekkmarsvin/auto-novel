name: CI Web

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CI Web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      HUSKY: '0'

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and build
        run: pnpm --stream --filter '@auto-novel/web...' --filter '@auto-novel/admin...' run build

      - name: Test
        run: |
          pnpm --filter @auto-novel/web test
          pnpm --filter @auto-novel/admin test
